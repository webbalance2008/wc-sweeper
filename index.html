<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 Sweepstake</title>
<style>
  :root{
    --text:#eef2fb; --muted:#94a4cc; --line:#27376f;
    --grad:linear-gradient(120deg,#9a3bff,#5b5bff 52%,#2e84ff);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1100px 560px at 50% -240px, rgba(124,58,237,.30), transparent 60%),
      radial-gradient(900px 480px at 108% -40px, rgba(46,132,255,.22), transparent 55%),
      linear-gradient(180deg,#0a1340,#070d28 62%);
    background-attachment:fixed;color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{max-width:520px;text-align:center;
    background:linear-gradient(180deg,#0f1f4d,#0b1740);border:1px solid var(--line);
    border-radius:18px;padding:44px 32px;box-shadow:0 10px 34px rgba(4,8,30,.45)}
  .trophy{font-size:56px;line-height:1;margin-bottom:18px}
  h1{margin:0 0 8px;font-size:24px;font-weight:800;line-height:1.2}
  h1 .yr{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:var(--muted);font-size:15px;line-height:1.6;margin:14px 0 0}
</style>
</head>
<body>
  <div class="card">
    <div class="trophy">🏆</div>
    <h1>World Cup <span class="yr">2026</span> Sweepstake</h1>
    <p>That's full time — the tournament is over and the sweepstake is now closed.</p>
    <p>Thanks for playing, and see you at the next one.</p>
  </div>
</body>
</html>
